<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>氧化妙妙屋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { background-color: #0b1120; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
  </style>
</head>
<body class="p-4 min-h-screen">
  <div class="max-w-md mx-auto pb-10">
    
    <!-- 顶部标题 -->
    <div class="text-center mb-5">
      <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-300">氧化妙妙屋</h1>
      <p class="text-gray-400 text-xs mt-1">组队开黑 · 快乐游戏</p>
    </div>

    <!-- 📢 公告栏 -->
    <div class="bg-blue-900/30 border border-blue-700/50 p-3 rounded-xl mb-6 flex items-start gap-2 shadow-lg">
      <span class="text-blue-500 text-lg">📢</span>
      <div class="text-xs text-blue-100/90 leading-relaxed">
        <span class="font-bold text-blue-400">公告：</span>
        欢迎来到妙妙屋！所有模式均为 6人局 · 无观战。大家按需选择“随机匹配”或“自己建房”！
      </div>
    </div>

    <!-- 🎲 纯随机匹配 -->
    <div class="glass p-4 rounded-2xl mb-6 shadow-xl border-t-2 border-t-green-500">
      <h2 class="text-sm font-bold text-green-400 mb-3 flex items-center gap-2">🎲 纯随机匹配 (满6人自动开局)</h2>
      <input type="text" id="matchName" placeholder="你的游戏ID" class="w-full p-2.5 mb-3 bg-slate-900/80 rounded-lg border border-slate-700 focus:outline-none focus:border-green-500 text-sm">
      <button onclick="joinRandomMatch()" id="matchBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition active:scale-95 text-sm shadow-[0_0_15px_rgba(34,197,94,0.4)]">
        开始随机匹配
      </button>
      <div id="matchQueue" class="mt-3 text-xs text-gray-400 bg-slate-900/50 p-2 rounded">
        当前排队人数：0 / 6
      </div>
    </div>

    <!-- ⚡ 指定模式求拉 -->
    <div class="glass p-4 rounded-2xl mb-6 shadow-xl">
      <h2 class="text-sm font-bold text-gray-300 mb-3 flex items-center gap-2">⚡ 指定模式 (求拉)</h2>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="quickMatch('休闲-站点模式')" class="bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs py-2 rounded-lg font-bold transition active:scale-95">站点模式</button>
        <button onclick="quickMatch('标准擂台')" class="bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs py-2 rounded-lg font-bold transition active:scale-95">标准擂台</button>
        <button onclick="quickMatch('激斗擂台')" class="bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs py-2 rounded-lg font-bold transition active:scale-95">激斗擂台</button>
      </div>
    </div>

    <!-- 🏠 自己建房 -->
    <div class="glass p-5 rounded-2xl mb-6 shadow-xl border-t-2 border-t-blue-500">
      <h2 class="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2">🏠 创建房间 (6人/无观战)</h2>
      <input type="text" id="playerName" placeholder="你的游戏ID" class="w-full p-2.5 mb-2 bg-slate-900/80 rounded-lg border border-slate-700 text-sm">
      <input type="text" id="roomCode" placeholder="游戏内房间号 (如: 1234)" class="w-full p-2.5 mb-3 bg-slate-900/80 rounded-lg border border-slate-700 text-sm">
      
      <select id="gameMode" class="w-full p-2.5 mb-3 bg-slate-900/80 rounded-lg border border-slate-700 text-sm">
        <option>休闲-站点模式</option>
        <option>标准擂台</option>
        <option>激斗擂台</option>
      </select>

      <button onclick="createRoom()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition active:scale-95 text-sm">发布到大厅</button>
    </div>

    <!-- 🌐 实时大厅列表 -->
    <div class="glass p-4 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
        <h2 class="text-sm font-bold text-white">当前在线大厅</h2>
        <span id="status" class="text-[10px] px-2 py-1 bg-slate-800 text-yellow-400 rounded-full">连接中...</span>
      </div>
      <div id="roomList" class="space-y-3 max-h-[40vh] overflow-y-auto pr-1">
        <p class="text-gray-500 text-center py-6 text-sm">暂无房间，快来抢首发！</p>
      </div>
    </div>
  </div>

  <script>
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const TOPIC_ROOMS = 'yanghua_miaomiao_room_v4';
    const TOPIC_MATCH = 'yanghua_miaomiao_match_v1'; // 匹配专用频道
    let rooms = [];
    let matchQueue = []; // 排队池
    let myMatchName = ""; // 当前正在匹配的玩家名字

    client.on('connect', () => {
      document.getElementById('status').innerText = '实时在线';
      document.getElementById('status').className = 'text-[10px] px-2 py-1 bg-green-900/50 text-green-400 rounded-full';
      client.subscribe(TOPIC_ROOMS, { qos: 1 });
      client.subscribe(TOPIC_MATCH, { qos: 1 });
    });

    client
