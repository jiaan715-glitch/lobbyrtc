<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重装上阵 - 纯净匹配大厅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-center mb-1 text-blue-500">重装上阵 纯净大厅</h1>
    <p class="text-center text-gray-400 text-xs mb-6">拒绝外挂，只和看得见的人玩</p>

    <div class="bg-gray-800 p-4 rounded-xl shadow-lg mb-6 border border-gray-700">
      <h2 class="text-lg font-bold mb-3 text-white">发布你的房间</h2>
      <input type="text" id="playerName" placeholder="你的游戏ID" class="w-full p-3 mb-3 bg-gray-900 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
      <input type="text" id="roomCode" placeholder="游戏内房间号（如：A1B2）" class="w-full p-3 mb-3 bg-gray-900 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
      <select id="gameMode" class="w-full p-3 mb-3 bg-gray-900 rounded-lg border border-gray-700 focus:outline-none text-white">
        <option>占点模式</option>
        <option>乱斗模式</option>
        <option>风暴模式</option>
        <option>自定义模式</option>
      </select>
      <button onclick="createRoom()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">发布房间</button>
    </div>

    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">大厅列表</h2>
        <span id="status" class="text-xs text-green-400">连接中...</span>
      </div>
      <div id="roomList" class="space-y-3">
        <p class="text-gray-500 text-center py-4 text-sm">暂无人开房，快来抢沙发！</p>
      </div>
    </div>
  </div>

  <script>
    // 这是一个公共的免费通讯服务器，不需要你掏钱，也不需要你注册
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const TOPIC = 'zhongzhuang/pure_lobby_rooms_2024';
    let rooms = [];

    client.on('connect', () => {
      document.getElementById('status').innerText = '已连接大厅';
      client.subscribe(TOPIC, { qos: 1 });
    });

    client.on('offline', () => {
      document.getElementById('status').innerText = '连接断开...';
      document.getElementById('status').className = 'text-xs text-red-400';
    });

    client.on('message', (topic, message) => {
      if (topic === TOPIC) {
        try {
          rooms = JSON.parse(message.toString());
          renderRooms();
        } catch (e) {}
      }
    });

    function createRoom() {
      const name = document.getElementById('playerName').value.trim();
      const code = document.getElementById('roomCode').value.trim();
      const mode = document.getElementById('gameMode').value;

      if (!name || !code) return alert("请填写游戏ID和房间号！");

      const newRoom = { id: Date.now().toString(), name, code, mode };
      
      // 清理超过 1 小时的过期房间
      const now = Date.now();
      rooms = rooms.filter(r => now - parseInt(r.id) < 3600000);
      rooms.push(newRoom);
      
      // 把新房间广播给所有在线的人
      client.publish(TOPIC, JSON.stringify(rooms), { retain: true, qos: 1 });
      document.getElementById('roomCode').value = '';
      alert("发布成功！快去游戏里等他们吧！");
    }

    function deleteRoom(id) {
      rooms = rooms.filter(r => r.id !== id);
      client.publish(TOPIC, JSON.stringify(rooms), { retain: true, qos: 1 });
    }

    function renderRooms() {
      const listEl = document.getElementById('roomList');
      if (rooms.length === 0) {
        listEl.innerHTML = '<p class="text-gray-500 text-center py-4 text-sm">暂无房间，快来抢沙发！</p>';
        return;
      }
      rooms.sort((a, b) => b.id - a.id);
      listEl.innerHTML = rooms.map(room => `
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 flex justify-between items-center">
          <div>
            <div class="font-bold text-blue-400 text-sm">${room.mode}</div>
            <div class="text-xs text-gray-300 mt-1">房主: ${room.name}</div>
            <div class="text-sm text-yellow-400 font-mono mt-1 font-bold">房号: ${room.code}</div>
          </div>
          <div class="flex flex-col gap-2">
             <button onclick="navigator.clipboard.writeText('${room.code}'); alert('房号已复制，快去游戏加入！')" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1.5 rounded">复制房号</button>
             <button onclick="deleteRoom('${room.id}')" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded">解散/满人</button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
